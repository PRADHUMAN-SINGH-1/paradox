name: Deploy PARADOX Makers

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore SEO memory
        uses: actions/cache@v4
        with:
          path: .seo-state
          key: seo-state-v1-${{ github.run_id }}
          restore-keys: |
            seo-state-v1-

      - name: Ingest first-party search performance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/fetch-performance.mjs

      - name: Refresh global demand intelligence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/update-demand.mjs

      - name: Score verified opportunities
        continue-on-error: true
        run: node scripts/score-opportunities.mjs

      - name: Run closed-loop SEO brain
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/seo-brain.mjs

      - name: Prune weak SEO routes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/prune-routes.mjs

      - name: Generate demand-driven utility catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/build-utility-opportunities.mjs

      - name: Build SEO sitemap from current plan
        continue-on-error: true
        run: node scripts/build-sitemap.mjs

      - name: Validate source files
        run: node --check scripts/score-opportunities.mjs && node --check scripts/prune-routes.mjs

      - name: Build Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Preserve runtime SEO plan
        uses: actions/upload-artifact@v4
        with:
          name: seo-runtime
          path: |
            src/data/seo-opportunities.json
            src/data/seo-plan.json
            src/data/utility-opportunities.json
            src/data/verified_opportunities.json
            src/data/blacklist.json
            public/sitemap.xml
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  index:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current SEO plan
        uses: actions/download-artifact@v4
        with:
          name: seo-runtime
      - name: Submit sitemap and URLs to search engines
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/submit-indexing.mjs
